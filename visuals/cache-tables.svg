    <text x="58" y="759" fill="#d7e3ed" font-size="17">PushTokens is a table name; no token values are shown.</text>
    <text x="58" y="794" fill="#d7e3ed" font-size="17">Local table rows are not remote record or transfer counts.</text>
    <text x="58" y="850" fill="#aebfd0" font-size="14">Source: local audit snapshot schema and counts · See cache-tables.csv for values</text>
